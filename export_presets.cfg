[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// The browser can throw away the game's graphics (WebGL) after a while idle, when the screen
// sleeps, or after a graphics driver reset. Godot can't recover from that: the picture freezes
// while the last looping sound plays on. So reload the game; it saves after every spin.
window.addEventListener('DOMContentLoaded', function () {
	var canvas = document.getElementById('canvas');
	if (!canvas) return;
	var reloading = false;
	function reload() {
		if (reloading) return;
		reloading = true;
		location.reload();
	}
	canvas.addEventListener('webglcontextlost', function (event) {
		event.preventDefault();
		var note = document.createElement('div');
		note.textContent = 'The browser reset the graphics. Reloading the game...';
		note.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#140a24;color:#f3c969;font:20px sans-serif;z-index:100';
		document.body.appendChild(note);
		setTimeout(reload, 1500);
	});
	canvas.addEventListener('webglcontextrestored', reload);
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
